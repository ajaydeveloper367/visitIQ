version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    environment:
      - CHROMA_DIR=/app/chroma_db
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: